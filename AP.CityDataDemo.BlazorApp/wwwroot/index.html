<head>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#512BD4" />
</head>
<body>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("service-worker.js")
        .then(() => console.log("Service Worker Registered"));
    }
  </script>
</body>
