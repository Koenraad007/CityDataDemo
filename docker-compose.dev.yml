version: "3.9"
services:
  # sqlserver:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   environment:
  #     SA_PASSWORD: "YourStrong@Passw0rd"
  #     ACCEPT_EULA: "Y"
  #   ports:
  #     - "1433:1433"
  #   volumes:
  #     - sql_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: AP.CityDataDemo.Presentation/Dockerfile
    environment:
      # listen on container port 5265 for HTTP
      - ASPNETCORE_URLS=http://+:5265
    ports:
      # map host port 5265 -> container 5265 so API is reachable from host
      - "5265:5265"
    restart: unless-stopped
    # depends_on:
    #   - sqlserver
    # environment:
    #   ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=MyApp;User Id=sa;Password=YourStrong@Passw0rd;"

  web:
    build:
      context: .
      dockerfile: AP.CityDataDemo.BlazorApp/Dockerfile
    depends_on:
      - api
    environment:
      # point the Blazor app to the API container by service name and port
      - ApiBaseUrl=http://api:5265/
      # ensure the Blazor app listens on container port 5240
      - ASPNETCORE_URLS=http://+:5240
    ports:
      # map host port 5240 -> container 5240 so web is reachable from host
      - "5240:5240"
    restart: unless-stopped
# volumes:
#   sql_data:
