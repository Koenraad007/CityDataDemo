version: "3.9"
services:
  sqlserver:
    container_name: sqlserver
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "YourStrong@Passw0rd",
          "-Q",
          "SELECT 1",
          "-b",
          "-C",
          "-o",
          "/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: AP.CityDataDemo.Presentation/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5265
    ports:
      - "5265:5265"
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - default
    volumes:
      - dataprotection-keys:/keys

  web:
    build:
      context: .
      dockerfile: AP.CityDataDemo.BlazorApp/Dockerfile
    depends_on:
      - api
    environment:
      - ApiBaseUrl=http://api:5265/
      - ASPNETCORE_URLS=http://+:5240
    ports:
      - "5240:5240"
    restart: unless-stopped
    networks:
      - default
    volumes:
      - dataprotection-keys:/keys

networks:
  default:

volumes:
  dataprotection-keys:
